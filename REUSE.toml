version = 1
SPDX-PackageName = "GusWorld"
SPDX-PackageSupplier = "Petrus Alves da Silva Costa"
SPDX-PackageDownloadLocation = "https://github.com/petrinhu/GusWorld"

# Codigo-fonte: AGPL-3.0-or-later (GODS_LAWS.md L-08).
[[annotations]]
path = [
  "**/*.cpp",
  "**/*.hpp",
  "**/*.h",
  "**/*.cc",
  "**/*.cmake",
  "CMakeLists.txt",
  "**/CMakeLists.txt",
]
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Assets (arte, musica, som, sprite, texto de sabor e prosa in-game):
# todos os direitos reservados (GODS_LAWS.md L-08, L-25). Numero e regra de
# carta (identificador, custo, poder, velocidade, efeito) sao codigo sob
# AGPL, tratados junto com o codigo-fonte acima quando forem escritos.
[[annotations]]
path = "resources/**"
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "LicenseRef-GusWorld-Assets-Reserved"

# Fonte PixelOperatorMono: obra de TERCEIRO sob CC0 1.0, nao asset reservado do
# titular. Reprovacao do A7 em 25/08/2026 (Claudio/CLO): a regra resources/**
# acima alcancava resources/fonts/**, declarando copyright de Petrus e "todos os
# direitos reservados" sobre uma fonte de Jayvee Enaguas (HarvettFox96) dedicada
# ao dominio publico -- misdeclaracao de proveniencia, nao ilicito (CC0 permite
# redistribuir sob qualquer termo). THIRD-PARTY-LICENSES.md ja documentava a
# licenca real; esta tabela so faz o REUSE.toml concordar com ele. Vem DEPOIS de
# resources/** de proposito, para vencer pela regra "a ultima que casa vence"
# (REUSE Spec 3.3, mesmo padrao ja usado para docs/narrative/** e para
# resources/cards/**, abaixo). Conserto: A14.
[[annotations]]
path = "resources/fonts/**"
SPDX-FileCopyrightText = "Jayvee Enaguas (HarvettFox96)"
SPDX-License-Identifier = "CC0-1.0"

# Catalogo de conteudo em formato proprio (.gw.<tipo>): NUMERO E REGRA de jogo,
# nao asset. Decisao do lider em 25/08/2026, resolvendo uma contradicao que o
# comentario de resources/** acima ja declarava sem que regra nenhuma a
# cumprisse: "numero e regra de carta sao codigo sob AGPL". Motivo de fundo: a
# Lei 9.610/98 art. 8 II exclui REGRA DE JOGO da protecao autoral, entao marcar
# custo, poder e duracao como asset reservado seria afirmar protecao que nao
# existe. Vem DEPOIS de resources/** de proposito: a ultima regra que casa vence
# (mesmo padrao ja usado para docs/narrative/**). TEXTO DE SABOR nao mora
# nestes arquivos -- ele e chave de traducao, resolvida em resources/translations/,
# que segue asset reservado.
[[annotations]]
path = ["resources/cards/**", "resources/**/*.gw.card", "resources/**/*.gw.batt", "resources/**/*.gw.virus", "resources/**/*.gw.item", "resources/**/*.gw.foe", "resources/**/*.gw.stat", "resources/**/*.gw.quest", "resources/**/*.gw.bag", "resources/**/*.gw.box", "resources/**/*.gw.table"]
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "assets/**"
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "LicenseRef-GusWorld-Assets-Reserved"

# Documentacao de PROJETO em docs/ (arquitetura, decisao, design,
# processo): acompanha a licenca do codigo. Fronteira DECIDIDA pelo
# lider em 22/08/2026: docs/narrative/** e docs/specs/** sao obra
# reservada (excecoes abaixo); docs/design/** e o restante de docs/
# ficam sob a licenca do codigo. As excecoes vem DEPOIS desta regra e
# a VENCEM: no REUSE.toml, quando varias tabelas [[annotations]]
# cobrem o mesmo arquivo, vale exclusivamente a ULTIMA que casa
# (REUSE Spec 3.3).
[[annotations]]
path = "docs/**"
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Livros-companheiros: obra a parte, todos os direitos reservados
# (GODS_LAWS.md L-08); cifrados por git-crypt (L-25). Nunca AGPL.
[[annotations]]
path = "docs/book/**"
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "LicenseRef-GusWorld-Assets-Reserved"

# Material reservado e cifrado por git-crypt (GODS_LAWS.md L-25):
# easter eggs e cosmologia de origem (_secret), ganchos pos-creditos e
# de continuacao (stinger). Reservados pelo mesmo motivo por que foram
# cifrados.
[[annotations]]
path = ["docs/_secret/**", "docs/narrative/deep/stinger/**"]
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "LicenseRef-GusWorld-Assets-Reserved"

# Obra criativa em docs/ (decisao do lider, 22/08/2026; GODS_LAWS.md
# L-08): lore, narrativa, fichas de personagem e worldbuilding sao a
# obra, nao documentacao de projeto. Inclui a antologia em
# docs/narrative/deep/antologia/, insumo do Vol 2 dos livros.
[[annotations]]
path = ["docs/narrative/**", "docs/specs/**"]
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "LicenseRef-GusWorld-Assets-Reserved"

[[annotations]]
path = ["*.md", "NOTICE"]
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Excecao na raiz (decisao do lider, 22/08/2026): inventario de
# personagens, de lugares e a sinopse sao da mesma natureza da biblia
# de lore; estao na raiz por conveniencia. Esta tabela vem DEPOIS da
# regra ["*.md", "NOTICE"] para vence-la (ultima que casa vence).
[[annotations]]
path = ["CHARS.md", "PLACES.md", "sinopse.md"]
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "LicenseRef-GusWorld-Assets-Reserved"

# Configuracao de repositorio (NAO e asset nem lore): .gitignore,
# .gitattributes e .claude/settings.json sao infraestrutura tecnica do
# projeto, mesma natureza de CMakeLists.txt e docs/** acima -- acompanham a
# licenca do codigo. .bigtech-porte idem; decisao do lider em 25/08/2026,
# verbatim registrada em GODS_LAWS.md L-14: "fica versionado e ganha
# anotacao", nao sai do git. Descoberto sem cobertura pelo `reuse lint`
# depois de instalado por pipx em 25/08/2026 (L-28). Conserto: A14.
[[annotations]]
path = [".gitignore", ".gitattributes", ".claude/settings.json", ".bigtech-porte"]
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Ferramenta do gate de commit-msg (L-19 portao 5): tools/security/termos_proibidos.txt
# e cifrado por git-crypt (L-25) -- cabecalho SPDX inline e IMPOSSIVEL porque o
# conteudo do arquivo e cifrado, so a anotacao aqui cobre. Mesma classificacao das
# demais ferramentas do projeto (script de tooling, nao asset nem lore); o CONTEUDO
# cifrado nao e lido nem citado aqui, so o caminho (L-25). Conserto: A14.
[[annotations]]
path = "tools/security/termos_proibidos.txt"
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# resumo.pdf NAO e configuracao: e "GUSWORLD(1) -- Resumo da Historia", o
# enredo do jogo em formato de pagina de manual. Pela L-08, lore e TODOS OS
# DIREITOS RESERVADOS -- classifica-lo como AGPL licenciaria a historia do
# jogo como software livre, erro de mao unica em repositorio publico.
# Conserto: A14.
[[annotations]]
path = "resumo.pdf"
SPDX-FileCopyrightText = "2026 Petrus Alves da Silva Costa"
SPDX-License-Identifier = "LicenseRef-GusWorld-Assets-Reserved"
