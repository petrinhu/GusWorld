#
# CVE gate over the build environment (items TST-3a, TST-3b and TST-3c). Orchestration only: no step
# here judges anything. Every judgement lives in tools/ci/cve/, one responsibility per script.
#   install_grype.sh  fetch grype, check its SHA-256, place it
#   expect.sh         assert one verdict (the proof and the real scan both use it)
#   scan.sh           run grype once with the policy, print the report, judge
#   report.sh         print the summary: packages, distro, CVEs by severity, feeds
#   judge.sh          map exit code, packages, distro and findings to one verdict
#   trivy/install_trivy.sh  fetch trivy, check its SHA-256, place it
#   trivy/scan.sh     run trivy once with the policy (image or rootfs), print the report, judge
#   trivy/report.sh   print the summary: OS, packages, targets, CRITICAL matches, data sources
#   trivy/judge.sh    map exit code, packages, distro and findings to one verdict
#   trivy/db_status.sh  print trivy's version and database metadata
#   env/<distro>.sh   the gate's own prerequisites (jq, and curl where the image lacks it)
#
# WHAT THE GATE BARS (leader, 20/11/2026): only CRITICAL with a published fix.
# grype: the verdict comes from grype's exit code 2 (--fail-on critical with --only-fixed),
# never from counting "Critical" in the JSON, because ignored matches also carry severities.
# trivy: the verdict comes from trivy's exit code 2 (--exit-code 2 with --severity CRITICAL and
# --ignore-unfixed). Everything else goes to the log. The full grype JSON and the full trivy
# JSON of the real scan are attached to the run as artifacts.
#
# COVERAGE (leader: "only where it is supported"): each distro is judged only by the tools that
# recognize it, and the gaps are declared here, not relaxed.
# - Fedora (fedora:latest): grype only. Trivy is NOT run here, by declared decision.
# - Ubuntu (ubuntu:latest): grype and trivy (TST-3b).
# - Arch (archlinux:latest): grype only. Trivy is NOT run here, by declared decision (TST-3c).
# - CachyOS belongs to TST-3d (wave 8). Windows and macOS have no coverage.
#
# DATABASE SOURCES (leader, 20/11/2026: "covered by both"). Stated here as the measured state,
# not as a claim:
# - NVD: through grype's database, as TST-3a declared (20/11/2026). The leader's decision says
#   it is covered by both tools. The docs of trivy (trivy.dev,
#   read 20/11/2026) list distro advisories and language advisories as its sources, and name NVD
#   only as a severity fallback, not as a source. So for trivy the NVD line is NOT confirmed by
#   its docs. The log shows the data source ID of every trivy match, and the grype log shows the
#   namespace of every grype match (for example nvd:cpe). Those lines are the measurement.
# - OSV: NOT confirmed for grype. "grype db status" does not list the upstream feeds. The grype
#   report shows the match namespaces, and an OSV line appears there only if a match came from
#   OSV. For trivy, the docs name OSV only for some ecosystems (crates.io), not as a general
#   source. OSV stays a declared limit for both tools.
# - The gap is declared in the log, never assumed: a source that did not show in a run is not
#   claimed as covered.
#
# WHY NOT A THIRD-PARTY ACTION FOR THE SCAN: a marketplace action runs code we do not read
# and tracks a moving tag. The grype and trivy tarballs are fetched from the official release,
# checked against a literal SHA-256, and only then placed on PATH. The artifact upload uses the
# official actions/upload-artifact, pinned by commit SHA.
#
# TRIVY PIN: trivy 0.76.2, SHA-256 bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf,
# read on 20/11/2026 from the official checksums file, line 7:
#   https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_checksums.txt
# Versions 0.69.4, 0.69.5 and 0.69.6 are vetoed by the leader and never pinned.
#
# THE PROOF OF STRENGTH (L-36 global): a gate never seen failing proves nothing.
# - Case A: alpine:3.12.7 by digest sha256:de25c7fc6c4f3a27c7f0c2dff454e4671823a34d88abd533f210848d527e0fbb
#   (registry API; Docker Hub last_updated 2021-07-30). Its openssl is older than 1.1.1l-r0.
#   CVE-2021-3711 (NVD CVSS 3.1 9.8 CRITICAL, published 2021-08-24) is fixed in 1.1.1l-r0
#   (Alpine secdb, branch v3.12). Expected VERDICT=finding, for grype and for trivy.
#   The trivy severity of this CVE on an EOL Alpine branch is NOT measured yet: it is the first
#   thing the trivy proof of the first run decides. If trivy does not call it CRITICAL, this
#   case is the wrong case for trivy, and the case changes with its source documented.
# - Case B: an empty directory. Expected VERDICT=zero (the package floor), for both tools.
# Both assert the verdict VALUE. Both go through expect.sh and the tool's scan.sh, the same
# path as the real scan (DRY). The trivy proof runs both cases before it judges, so a red run
# shows the raw facts of each case.
# Measured on the first run (20/11/2026, run 44755957346, grype only): the registry: source
# with a digest reference works, the CVE is judged critical with a fix, and the package-count
# regex matches grype 0.122.1. The trivy and Ubuntu numbers were measured on run 44792180987
# (commit 4b0996d, 20/11/2026): ubuntu:latest gives VERSION_ID="26.04", the grype feeds were
# alpine, nvd:cpe, govulndb and ubuntu:distro:ubuntu:26.04, the trivy data source of case A was
# alpine, and the real scans printed TRIVY CVE GATE ACCEPTED and CVE GATE ACCEPTED.
# Measured on run 44793892079 (20/11/2026, commit 411e4ad), Arch entry: grype names the distro
# "archlinux" with the feed arch:distro:archlinux:rolling, 190 packages, 9 matches ignored for
# lacking a fix, and no critical with a fix. The first run was red only by name (distro-mismatch),
# so the judge now expects scan_distro, the name grype and trivy report for the distro. It is
# equal to matrix distro for fedora and ubuntu, and archlinux for arch. matrix.distro still picks
# the environment scripts. The trivy name for ubuntu is measured on run 44792180987: trivy accepted the real scan with the name ubuntu.
#
# DECLARED LIMITS
# - fedora:latest is Fedora 45 (VERSION_ID=45 measured on 20/11/2026). ubuntu:latest is Ubuntu
#   26.04 by the same tag rule. Both tags move: when the release changes, the gate measures it
#   again. An unrecognized distro rejects (fail closed). Leader decision: keep :latest and
#   measure (L-09 project).
# - archlinux:latest is a rolling release. Measured on run 44793892079 (20/11/2026): os-release
#   gives ID=arch and VERSION_ID=20261108.0.623074, and the grype distro name is "archlinux", not
#   "arch". The matrix carries it as scan_distro. Trivy does not cover this entry.
# - The exclude globs (./proc/**, and so on) are relative to the scan root. For trivy they are
#   passed as --skip-dirs in both the relative and the absolute spelling, because the docs do
#   not confirm which one matches. Which spelling matched is read from the Targets line of the
#   trivy report. A passing run does not prove the excludes worked, so they stay under measurement.
# - A package in no database is invisible to the gate.

name: Portão de CVE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cve:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - name: Fedora (grype)
            image: fedora:latest
            distro: fedora
            scan_distro: fedora
            trivy: false
            git_install: "dnf -y install git"
          - name: Ubuntu (trivy e grype)
            image: ubuntu:latest
            distro: ubuntu
            scan_distro: ubuntu
            trivy: true
            git_install: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git"
          - name: Arch (grype)
            image: archlinux:latest
            distro: arch
            scan_distro: archlinux
            trivy: false
            git_install: "pacman -Syu --noconfirm --needed git"
    steps:
      # The image ships without git. Install it first, so the checkout is a real git clone.
      # The command comes from the matrix because the repository (and so any script in it)
      # does not exist yet at this step. It is the same per-image data as build.yml.
      - name: Install git before the checkout
        run: ${{ matrix.git_install }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Container jobs run as root, and root sees the workspace owned by the runner user
      # as "dubious ownership" (CVE-2022-24765). Set this before any git call.
      - name: Git safe.directory for the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The same toolchain as the build, so the scan covers the real build environment.
      # The script is only read here, never edited.
      - name: Install the build toolchain
        run: bash tools/ci/env/${{ matrix.distro }}.sh

      # The gate's own prerequisites (jq for the report, curl and ca-certificates where the
      # image lacks them). Per distro, in tools/ci/cve/env/, not in the shared build toolchain.
      - name: Install the CVE gate prerequisites
        run: bash tools/ci/cve/env/${{ matrix.distro }}.sh

      # The job-level env cannot read the runner context (GitHub contexts table, jobs.<job_id>.env),
      # so the cache paths are written from a step, where runner.temp is available.
      # The caches live under the runner temp dir, which the real scan excludes.
      - name: Point the grype and trivy database caches under the runner temp dir
        run: |
          echo "GRYPE_DB_CACHE_DIR=$RUNNER_TEMP/grype-db" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"

      - name: Install grype pinned by SHA-256
        run: bash tools/ci/cve/install_grype.sh "$RUNNER_TEMP/bin"

      - name: Put grype on PATH and print its version
        run: |
          set -eu
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/grype" version

      # trivy goes to the same bin directory, which is already on PATH. Only the Ubuntu entry runs it.
      - name: Install trivy pinned by SHA-256
        if: matrix.trivy
        run: bash tools/ci/cve/trivy/install_trivy.sh "$RUNNER_TEMP/bin"

      # always() here does not depend on the real scan, which runs later. It makes the proof
      # run even if an earlier step failed, so a red run still shows whether the gate works.
      - name: Proof of strength, the gate must judge an old vulnerable image and an empty directory
        if: always()
        run: |
          set -u
          expect="$GITHUB_WORKSPACE/tools/ci/cve/expect.sh"
          if ! bash "$expect" finding alpine "$RUNNER_TEMP/proof-alpine" "registry:alpine@sha256:de25c7fc6c4f3a27c7f0c2dff454e4671823a34d88abd533f210848d527e0fbb"; then
            echo "PROOF A FAILED: the old Alpine image was not judged a finding"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/proof-empty-dir"
          if ! bash "$expect" zero "${{ matrix.scan_distro }}" "$RUNNER_TEMP/proof-empty" "dir:$RUNNER_TEMP/proof-empty-dir"; then
            echo "PROOF B FAILED: the empty directory was not judged zero"
            exit 1
          fi
          echo "PROOF PASSED: A judged finding, B judged zero"

      # The trivy proof has the same two cases and the same expect.sh path, with the trivy
      # scan selected through CVE_SCAN. Both cases run before the verdict, so a red run shows
      # the raw facts of each one, and the message names the case that failed.
      - name: Trivy proof of strength, the gate must judge an old vulnerable image and an empty directory
        if: always() && matrix.trivy
        run: |
          set -u
          expect="$GITHUB_WORKSPACE/tools/ci/cve/expect.sh"
          export CVE_SCAN="$GITHUB_WORKSPACE/tools/ci/cve/trivy/scan.sh"
          a=0
          bash "$expect" finding alpine "$RUNNER_TEMP/proof-trivy-alpine" "registry:alpine@sha256:de25c7fc6c4f3a27c7f0c2dff454e4671823a34d88abd533f210848d527e0fbb" || a=1
          mkdir -p "$RUNNER_TEMP/proof-trivy-empty-dir"
          b=0
          bash "$expect" zero "${{ matrix.scan_distro }}" "$RUNNER_TEMP/proof-trivy-empty" "dir:$RUNNER_TEMP/proof-trivy-empty-dir" || b=1
          if [ "$a" -ne 0 ]; then echo "TRIVY PROOF A FAILED: the old Alpine image was not judged a finding"; fi
          if [ "$b" -ne 0 ]; then echo "TRIVY PROOF B FAILED: the empty directory was not judged zero"; fi
          if [ "$a" -ne 0 ] || [ "$b" -ne 0 ]; then exit 1; fi
          echo "TRIVY PROOF PASSED: A judged finding, B judged zero"

      # The database sources are read here, after the proofs have fetched the databases.
      # grype db status prints where the database lives and when it was built. The feeds of
      # each match are printed by the grype report (namespace) and the trivy report (data source).
      - name: Print the grype database status
        if: always()
        run: grype db status || echo "grype db status failed"

      - name: Print the trivy version and database status
        if: always() && matrix.trivy
        run: bash tools/ci/cve/trivy/db_status.sh

      - name: Scan the real build environment with grype
        run: |
          set -u
          expect="$GITHUB_WORKSPACE/tools/ci/cve/expect.sh"
          if ! bash "$expect" accept "${{ matrix.scan_distro }}" "$RUNNER_TEMP/scan-${{ matrix.distro }}" "dir:/" \
            --exclude './proc/**' --exclude './sys/**' --exclude './dev/**' \
            --exclude './__e/**' --exclude './__w/**' --exclude './__t/**' \
            --exclude './github/**'; then
            echo "CVE GATE REJECTED"
            exit 1
          fi
          echo "CVE GATE ACCEPTED"

      # The same excludes as the grype scan. The trivy scan turns each one into --skip-dirs.
      - name: Scan the real build environment with trivy
        if: matrix.trivy
        run: |
          set -u
          expect="$GITHUB_WORKSPACE/tools/ci/cve/expect.sh"
          export CVE_SCAN="$GITHUB_WORKSPACE/tools/ci/cve/trivy/scan.sh"
          if ! bash "$expect" accept "${{ matrix.scan_distro }}" "$RUNNER_TEMP/scan-trivy-${{ matrix.distro }}" "dir:/" \
            --exclude './proc/**' --exclude './sys/**' --exclude './dev/**' \
            --exclude './__e/**' --exclude './__w/**' --exclude './__t/**' \
            --exclude './github/**'; then
            echo "TRIVY CVE GATE REJECTED"
            exit 1
          fi
          echo "TRIVY CVE GATE ACCEPTED"

      # Attached even when the scan rejects, so the full list is in the run for download.
      - name: Attach the full grype JSON of the real scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-${{ matrix.distro }}-real-scan
          path: ${{ runner.temp }}/scan-${{ matrix.distro }}/grype.json
          if-no-files-found: warn

      - name: Attach the full trivy JSON of the real scan
        if: always() && matrix.trivy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ matrix.distro }}-real-scan
          path: ${{ runner.temp }}/scan-trivy-${{ matrix.distro }}/trivy.json
          if-no-files-found: warn
