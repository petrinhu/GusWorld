#
# Build and ctest for every target in the matrix (items C4a and C4b1 to C4b5).
# Each target is supported only once its own entry has run green. Until then,
# none is declared supported.
#
# Shell: every run step uses bash. On the Linux containers that adds pipefail
# to each step. On Windows, bash is Git Bash.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # The job runs inside the distro image. The runner is only the host.
    # The Windows entry has no image, so its job runs on the bare runner.
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    # The matrix picks the compiler for each entry; the toolchain step installs both.
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    strategy:
      matrix:
        include:
          - name: Fedora (GCC)
            slug: fedora
            runner: ubuntu-latest
            image: fedora:latest
            cc: gcc
            cxx: g++
            git_install: "dnf -y install git"
          - name: Fedora (Clang)
            slug: fedora
            runner: ubuntu-latest
            image: fedora:latest
            cc: clang
            cxx: clang++
            git_install: "dnf -y install git"
          - name: Ubuntu (GCC)
            slug: ubuntu
            runner: ubuntu-latest
            image: ubuntu:latest
            cc: gcc
            cxx: g++
            git_install: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git"
          - name: Ubuntu (Clang)
            slug: ubuntu
            runner: ubuntu-latest
            image: ubuntu:latest
            cc: clang
            cxx: clang++
            git_install: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git"
          - name: Arch (GCC)
            slug: arch
            runner: ubuntu-latest
            image: archlinux:latest
            cc: gcc
            cxx: g++
            git_install: "pacman -Syu --noconfirm --needed git"
          - name: Arch (Clang)
            slug: arch
            runner: ubuntu-latest
            image: archlinux:latest
            cc: clang
            cxx: clang++
            git_install: "pacman -Syu --noconfirm --needed git"
          - name: CachyOS (GCC)
            slug: cachyos
            runner: ubuntu-latest
            image: cachyos/cachyos:latest
            cc: gcc
            cxx: g++
            git_install: "pacman -Syu --noconfirm --needed git"
          - name: CachyOS (Clang)
            slug: cachyos
            runner: ubuntu-latest
            image: cachyos/cachyos:latest
            cc: clang
            cxx: clang++
            git_install: "pacman -Syu --noconfirm --needed git"
          - name: Windows (MSVC)
            slug: windows
            runner: windows-latest
            image: ""
            cc: ""
            cxx: ""
            git_install: "git --version"
    steps:
      # The image ships without git. Install it first, with no file from this
      # repository, so the checkout below is a real git clone. Without git,
      # actions/checkout downloads a tarball through the REST API, and that
      # path failed with 5xx from GitHub three times in each of two runs
      # (run 38196743681, SHA 74fc8eb).
      - name: Install git (before the checkout)
        run: ${{ matrix.git_install }}

      # Default depth: no test in the current suite reads history or tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Container jobs run as root, and root sees the workspace owned by the
      # runner user as "dubious ownership" (CVE-2022-24765). Set this before
      # any git call in this job.
      - name: Git safe.directory for the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Toolchain from the repository copy, now that the checkout is real. It
      # exports CC and CXX and installs cmake, which the steps below use.
      - name: Install toolchain
        run: bash tools/ci/env/${{ matrix.slug }}.sh

      # A tarball has no .git, so rev-parse fails under set -eu. Passing this
      # step is the proof that the checkout was a real git clone at GITHUB_SHA.
      - name: Prove the checkout is a git clone at GITHUB_SHA
        run: |
          set -eu
          inside="$(git rev-parse --is-inside-work-tree)"
          echo "is-inside-work-tree=${inside}"
          if [ "$inside" != true ]; then
            echo "FAIL: the workspace is not a git work tree"
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          echo "HEAD=${head}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "FAIL: HEAD differs from GITHUB_SHA"
            exit 1
          fi

      # Floor from the project's cmake_minimum_required(4.1). The version is
      # read from a file, not from a pipe, so a failing cmake cannot hide
      # behind the sed that follows it.
      - name: Version floor (CMake 4.1)
        run: bash tools/ci/cmake_floor.sh

      # -DGUSWORLD_WERROR=ON is the gate for GW-19 (portao 1): zero warnings.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DGUSWORLD_WERROR=ON ${CXX:+"-DCMAKE_CXX_COMPILER=$CXX"}

      # The Visual Studio generator is multi-config: the configuration comes from
      # CMAKE_CONFIG_TYPE. The variable is unset on Linux, so the flag is left out there.
      - name: Build
        run: cmake --build build ${CMAKE_CONFIG_TYPE:+--config "$CMAKE_CONFIG_TYPE"}

      # ctest -N exits 0 even with zero tests, so the exit code alone proves
      # nothing. The count is read from the value, and zero fails on purpose:
      # an empty scan is a broken scan, not a clean tree (L-36).
      - name: Count registered tests (zero is a failure)
        run: |
          set -eu
          ctest --test-dir build ${CMAKE_CONFIG_TYPE:+-C "$CMAKE_CONFIG_TYPE"} -N > inventory.txt 2>&1 \
            || { cat inventory.txt; exit 1; }
          cat inventory.txt
          total="$(sed -n 's/^Total Tests: //p' inventory.txt)"
          echo "registered tests: ${total:-<unreadable>}"
          case "$total" in
            ''|*[!0-9]*)
              echo "FAIL: the test count is missing or not a number"
              exit 1
              ;;
          esac
          if [ "$total" -eq 0 ]; then
            echo "FAIL: zero tests registered"
            exit 1
          fi

      - name: Run tests (ctest)
        run: ctest --test-dir build ${CMAKE_CONFIG_TYPE:+-C "$CMAKE_CONFIG_TYPE"} --output-on-failure
