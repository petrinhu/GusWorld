#
# Formatting gate (TODO item C11, the clang-format half of criterion (3) of C5c). A
# separate job in its own file, like cppcheck.yml and clang-tidy.yml.
#
# The reformatting patch is produced HERE, in CI, because nothing runs on the lead's
# machine (L-35 of the project). The patch is uploaded as the artifact clang-format-patch
# and applied in a slice of its own. The gate below still fails on a non-conforming tree:
# the patch step does not change the verdict.
#
# This file is orchestration only. The logic lives in tools/ci/clang_format/
# (enumerate.sh, judge.sh, proof.sh, patch.sh), one responsibility each.
name: Formatação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format sobre a árvore real, com prova vermelha antes
    runs-on: ubuntu-latest
    # The job runs inside the distro image. The runner is only the host.
    container: fedora:latest
    steps:
      # The image ships without git. Install it first, so the checkout is a real git
      # clone (same reason as build.yml and cppcheck.yml).
      - name: Install git (before the checkout)
        run: dnf -y install git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Container jobs run as root, and root sees the workspace as "dubious ownership".
      - name: Git safe.directory for the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # clang-format comes from clang-tools-extra on Fedora. The version is printed, so
      # the log shows which clang-format judged the tree. The judge refuses a version
      # below its declared floor.
      - name: Install clang-format
        run: |
          set -eu
          dnf -y install clang-tools-extra
          rpm -q clang-tools-extra
          clang-format --version

      # Every C and C++ source of the tree, into the list file. Zero is a failure (L-36).
      - name: Enumerate the sources (zero is a failure)
        run: bash tools/ci/clang_format/enumerate.sh "$RUNNER_TEMP/sources.txt"

      # Red proof, before the gate: a badly formatted file generated in the runner's temp
      # directory must be REJECTED (exit 1 and the id clang-format-violations), and the
      # output of clang-format must be ACCEPTED. The step fails with FORMAT PROOF FAILED
      # otherwise.
      - name: Red proof, a badly formatted file must be rejected
        run: bash tools/ci/clang_format/proof.sh "$RUNNER_TEMP/clang-format-proof"

      # The gate on the real tree: one clang-format process per file. The verdict comes
      # from judge.sh, not from this file.
      # Limit: the tree is judged as it is. A violation here is a real finding; the
      # reformatting is delivered as the patch below, applied in a slice of its own.
      - name: Gate, clang-format on the real tree, one process per file
        run: bash tools/ci/clang_format/judge.sh "$RUNNER_TEMP/sources.txt" "$RUNNER_TEMP/clang-format-real.log"

      # Runs even when the gate is red (always): the patch is the deliverable of a red
      # gate. patch.sh rewrites the files in place and writes the diff; it never judges.
      - name: Reformatting patch, produced in CI
        if: always()
        run: bash tools/ci/clang_format/patch.sh "$RUNNER_TEMP/sources.txt" "$RUNNER_TEMP/clang-format.patch"

      # The patch is attached to the run as the artifact clang-format-patch. A missing
      # file is an error, not a silent empty upload.
      - name: Upload the patch as the clang-format-patch artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clang-format-patch
          path: ${{ runner.temp }}/clang-format.patch
          if-no-files-found: error
