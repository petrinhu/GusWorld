#
# Static analysis gate, clang-tidy half (L-19 portao 3; cppcheck is the other half, see
# cppcheck.yml). A separate job in its own file, like cppcheck.yml and sanitizers.yml.
# This file is orchestration only. The logic and the reason of each rule live in
# tools/ci/clang_tidy/ (enumerate.sh, check_db.sh, scan.sh, judge.sh).
name: Análise estática com clang-tidy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-tidy:
    name: clang-tidy sobre a árvore real, com provas vermelhas nos dois casos
    runs-on: ubuntu-latest
    # The job runs inside the distro image. The runner is only the host.
    container: fedora:latest
    steps:
      # The image ships without git. Install it first, so the checkout is a real git
      # clone (same reason as build.yml, runs 38196743681 and 74fc8eb).
      - name: Install git (before the checkout)
        run: dnf -y install git

      - name: Checkout
        uses: actions/checkout@v7

      # Container jobs run as root, and root sees the workspace as "dubious ownership".
      - name: Git safe.directory for the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Toolchain from the repository copy. It exports CC and CXX and installs cmake,
      # which the configure step below uses.
      - name: Install toolchain
        run: bash tools/ci/env/fedora.sh

      # Floor from the project's cmake_minimum_required(4.1). Same check as build.yml.
      - name: Version floor (CMake 4.1)
        run: bash tools/ci/cmake_floor.sh

      # Installed in its own step, so a missing package fails here and not in the gate.
      # The version is printed, so the log shows which clang-tidy ran. The package name
      # is not documented by clang-tidy itself; on Fedora clang-tools-extra provides it.
      - name: Install clang-tidy
        run: |
          set -eu
          dnf -y install clang clang-tools-extra
          rpm -q clang clang-tools-extra
          clang-tidy --version

      # Configure only, to generate the compile database. GUSWORLD_PRESENT is ON here
      # for the database alone: nothing is compiled. The compile database comes from a
      # configure that turns GUSWORLD_PRESENT on. That option is only switched on so the
      # database describes the whole tree (11 files). present/ stays blocked for BUILD
      # (L-06 and L-27 of the project laws). This exception was authorized by the project
      # lead on 12/10/2026 (explicit state, L-02 of the global laws). It applies ONLY to
      # this job and ONLY to this configure step. No other file, job or step inherits this
      # permission: whoever needs it again asks again.
      # Module scanning OFF: Ninja would otherwise write GCC module-scan flags into the
      # database, which clang-tidy rejects. This project uses no C++ modules.
      - name: Configure only, with present/ in the database
        run: |
          set -eu
          cmake -S . -B "$RUNNER_TEMP/clang-tidy-build" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGUSWORLD_PRESENT=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          test -s "$RUNNER_TEMP/clang-tidy-build/compile_commands.json"

      # Every .cpp of the tree, fixtures excluded. The script refuses an empty list (L-36).
      - name: Enumerate the sources (zero is a failure)
        run: bash tools/ci/clang_tidy/enumerate.sh "$RUNNER_TEMP/sources.txt"

      # The compile database must match the tree in both directions, before the gate runs.
      - name: Compile database matches the tree exactly (both directions)
        run: bash tools/ci/clang_tidy/check_db.sh "$RUNNER_TEMP/clang-tidy-build/compile_commands.json" "$RUNNER_TEMP/sources.txt" "$RUNNER_TEMP"

      # The gate on the real tree: one clang-tidy process per file. Verdict from judge.sh.
      - name: Gate, clang-tidy on the real tree, one process per file
        run: bash tools/ci/clang_tidy/scan.sh real "$RUNNER_TEMP/tidy-real.log" "$RUNNER_TEMP/tidy-records.txt" "$RUNNER_TEMP/clang-tidy-build" "$RUNNER_TEMP/sources.txt"

      # Red proof, case WITH the option. Must exit non-zero and print the check id.
      - name: Red proof, WITH --warnings-as-errors (must fail and name the check)
        run: bash tools/ci/clang_tidy/scan.sh with "$RUNNER_TEMP/with.log" tests/fixtures/clang_tidy/clang_tidy_fixture.cpp

      # Red proof, case WITHOUT the option: the trap. Must exit 0 with the finding in the log.
      - name: Red proof, WITHOUT --warnings-as-errors (the trap, must exit 0 with the finding)
        run: bash tools/ci/clang_tidy/scan.sh without "$RUNNER_TEMP/without.log" tests/fixtures/clang_tidy/clang_tidy_fixture.cpp
